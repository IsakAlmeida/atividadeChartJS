<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráficos de umidade e temperatura</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="titulo">
    <h1>Dashboard de <strong id="umi">Umidade</strong> e <strong id="temp">Temperatura</strong></h1> 
    <img src="./bandeira.png" alt="bandeiraEUA">
    </div>

    <div class="graficos">
    <canvas id="myChartLine"></canvas>
    <canvas id="myChartBar"></canvas>
   </div>
</body>
</html>
<script>
  const ctx = document.getElementById('myChartLine');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
      datasets: [{
        label: 'Temperatura °C',
        data: [30, 29, 28, 25, 22, 23],
        borderWidth: 1,
        borderColor: 'red',
        backgroundColor: 'red'
      }, {
        label: 'Umidade %',
        data: [80, 82, 80, 85, 80, 83],
        borderWidth: 1, 
        borderColor: 'blue',
        backgroundColor: 'blue'
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });

  const ctx2 = document.getElementById('myChartBar');

  new Chart(ctx2, {
    type: 'bar',
    data: {
      labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'],
      datasets: [{
        label: 'Temperatura Média °C',
        data: [22, 24, 27, 23, 20, 18],
        borderWidth: 1,
        borderColor: 'red',
        backgroundColor: 'red'
      }, {
        label: 'Umidade Média em %',
        data: [90, 89, 93, 87, 88, 82],
        borderWidth: 1, 
        borderColor: 'blue',
        backgroundColor: 'blue'
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>
